[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfslim"
version = "1.0.0"
description = "Zero-Bloat PDF Compressor & Metadata Sanitizer CLI"
readme = "README.md"
authors = [
  { name = "Moch. Erik Irriansyah", email = "erik@narotama.ac.id" }
]
license = { text = "MIT" }
keywords = ["pdf", "compressor", "optimizer", "metadata-sanitizer", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
pdfslim = "pdfslim.cli:main"

[project.urls]
Homepage = "https://github.com/MochErik/pdfslim"
Repository = "https://github.com/MochErik/pdfslim.git"
Issues = "https://github.com/MochErik/pdfslim/issues"
